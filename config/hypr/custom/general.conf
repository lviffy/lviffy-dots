# Custom configuration overrides
# Modern, clean, minimal animations & UX improvements

animations {
    enabled = true

    # Modern, minimal bezier curves (no cartoon bounce/overshoot)
    bezier = cleanDecel, 0.05, 0.9, 0.1, 1.0
    bezier = cleanExit, 0.2, 0.0, 0.0, 1.0

    # Window open (subtle popin + smooth fade)
    animation = windowsIn, 1, 2.5, cleanDecel, popin 88%
    animation = fadeIn, 1, 2.0, cleanDecel

    # Window close (brisk, clean exit)
    animation = windowsOut, 1, 1.8, cleanDecel, popin 92%
    animation = fadeOut, 1, 1.6, cleanDecel

    # Tiling & window move / resize (smooth fluid transition between tile layouts)
    animation = windowsMove, 1, 2.4, cleanDecel

    # Workspaces (subtle 20% slide + crossfade, snappy and modern)
    animation = workspaces, 1, 2.2, cleanDecel, slidefade 20%
    animation = specialWorkspaceIn, 1, 2.0, cleanDecel, slidefadevert 20%
    animation = specialWorkspaceOut, 1, 1.5, cleanDecel, slidefadevert 20%

    # Layers & Popups (app launchers, quickshell, OSD, notifications)
    animation = layersIn, 1, 2.0, cleanDecel, popin 94%
    animation = layersOut, 1, 1.5, cleanDecel, popin 94%
    animation = fadeLayersIn, 1, 1.8, cleanDecel
    animation = fadeLayersOut, 1, 1.5, cleanDecel
}

decoration {
    dim_inactive = true
    dim_strength = 0.08
}

dwindle {
    smart_split = true
}

misc {
    enable_swallow = true
    swallow_regex = ^(foot|kitty|alacritty|Alacritty)$
}
